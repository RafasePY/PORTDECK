name: Android APK
on:
  push:
    branches: ["feature/android-tablet-v0.1", "feature/android-v0.1.1-shortcuts-nintendo", "feature/android-v0.1.2-home-shortcuts-battery", "feature/android-safe-no-home", "feature/dashboard-profiles-v0.5", "feature/portal-identity-v0.6", "ccr-a064814d-udfijf"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["feature/pulse-v0.4.2-identity-controls"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Test existing Windows backend and controllers
        run: npm test
      - name: Build Android WebView interface
        run: npm run build:android
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Install native app launch bridge
        run: node scripts/prepare-android.cjs
      - name: Sync Android assets
        run: npx cap sync android
      - name: Compile Android APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PortDeck-Android-Safe-v0.7-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Add optional notification reader
        env:
          PORTDECK_NOTIFICATIONS: "1"
        run: node scripts/prepare-android.cjs
      - name: Compile Android APK with notification pop-ups
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK with notification pop-ups
        uses: actions/upload-artifact@v4
        with:
          name: PortDeck-Android-Safe-v0.7-Notificacoes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
