name: Interface checks
on:
  push:
    branches: ["feature/portal-identity-v0.6", "ccr-a064814d-udfijf", "feature/control-center-v0.9"]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npx playwright test
